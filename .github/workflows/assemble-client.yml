name: assemble-client
on:
  push:
    branches: [main]
    paths:
      - 'lib/client.js.b64.*'
      - 'lib/client.js.map.b64.*'
      - '.github/workflows/assemble-client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble client.js and client.js.map
        run: |
          set -euo pipefail
          cat \
            lib/client.js.b64.00 \
            lib/client.js.b64.01 \
            lib/client.js.b64.02 \
            lib/client.js.b64.03 \
            lib/client.js.b64.04 \
            lib/client.js.b64.05 \
            lib/client.js.b64.06 \
            lib/client.js.b64.07 \
            > /tmp/client.b64
          base64 -d /tmp/client.b64 | gzip -d > lib/client.js
          test "$(wc -c < lib/client.js)" -eq 51420
          grep -q '0.2.0' lib/client.js
          grep -q request-restart lib/client.js
          cat \
            lib/client.js.map.b64.00 \
            lib/client.js.map.b64.01 \
            lib/client.js.map.b64.02 \
            lib/client.js.map.b64.03 \
            lib/client.js.map.b64.04 \
            lib/client.js.map.b64.05 \
            lib/client.js.map.b64.06 \
            lib/client.js.map.b64.07 \
            lib/client.js.map.b64.08 \
            lib/client.js.map.b64.09 \
            lib/client.js.map.b64.10 \
            lib/client.js.map.b64.11 \
            > /tmp/client.map.b64
          base64 -d /tmp/client.map.b64 | gzip -d > lib/client.js.map
          test "$(wc -c < lib/client.js.map)" -eq 76394
          grep -q sourcesContent lib/client.js.map
          grep -q '0.2.0' lib/client.js.map
          grep -q request-restart lib/client.js.map
      - name: Commit assembled artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js lib/client.js.map
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Target standard DSH Desktop; drop AI Buddy desktop API dependency"
          git push
