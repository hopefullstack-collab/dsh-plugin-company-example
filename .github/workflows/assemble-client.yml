name: assemble-client
on:
  workflow_dispatch:
  push:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble client.js and client.js.map
        run: |
          set -euo pipefail
          cat lib/client.js.b64.00 lib/client.js.b64.01 > /tmp/client.b64
          base64 -d /tmp/client.b64 | gzip -d > lib/client.js
          test "$(wc -c < lib/client.js)" -eq 51546
          rg -q dshCompanyGrid lib/client.js
          cat lib/client.js.map.b64.00 lib/client.js.map.b64.01 lib/client.js.map.b64.02 > /tmp/client.map.b64
          base64 -d /tmp/client.map.b64 | gzip -d > lib/client.js.map
          test "$(wc -c < lib/client.js.map)" -eq 77018
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js lib/client.js.map
          if git diff --cached --quiet; then
            echo "no assemble changes"
          else
            git commit -m "Assemble lib/client.js and lib/client.js.map from parts"
            git push
          fi
