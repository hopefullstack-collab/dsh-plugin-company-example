name: assemble-client
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/client.chunk.*.js'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate chunks into lib/client.js
        run: |
          cat lib/client.chunk.0.js lib/client.chunk.1.js lib/client.chunk.2.js lib/client.chunk.3.js lib/client.chunk.4.js lib/client.chunk.5.js > lib/client.js
          wc -c lib/client.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js
          git diff --cached --quiet || git commit -m "Assemble lib/client.js from chunks"
          git push
